[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-transcribe"
version = "0.2.0"
description = "Reliable local audio transcription on Apple Silicon with MLX Whisper"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["yt-dlp[default]>=2026.1.1", "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
local-transcribe = "local_transcribe.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
